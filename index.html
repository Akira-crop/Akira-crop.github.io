<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Akira 的学习笔记库 - 课程笔记与论文笔记">
    <meta name="keywords" content="学习笔记, CS61B, Java, 论文笔记, 编程">
    <title>Akira's Notes - 学习笔记库</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/">Akira's Notes</a>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="active">首页</a></li>
                <li><a href="#posts">笔记</a></li>
                <li><a href="#tags">标签</a></li>
                <li><a href="#about">关于</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 首页 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <div class="hero-badge">LEARNING_ARCHIVE // v1.0</div>
            <h1>Akira 的<span class="accent">学习笔记库</span></h1>
            <p class="hero-subtitle">课程笔记<span class="sep">/</span>论文笔记<span class="sep">/</span>读书笔记</p>
            <div class="hero-actions">
                <a class="neon-btn cyan" href="#posts" onclick="filterByCategory('课程笔记'); return false;">课程笔记</a>
                <a class="neon-btn pink" href="#posts" onclick="filterByCategory('论文笔记'); return false;">论文笔记</a>
                <a class="neon-btn purple" href="#posts" onclick="filterByCategory('读书笔记'); return false;">读书笔记</a>
            </div>
            <div class="hero-stats" id="heroStats"></div>
        </div>
    </section>

    <!-- 笔记列表 -->
    <section id="posts" class="posts-section">
        <div class="container">
            <h2 class="section-title">学习笔记</h2>
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索笔记...">
                </div>
                <div class="category-filters" id="categoryFilters">
                    <button class="category-btn active" data-category="全部">全部</button>
                    <button class="category-btn" data-category="课程笔记">课程笔记</button>
                    <button class="category-btn" data-category="论文笔记">论文笔记</button>
                    <button class="category-btn" data-category="读书笔记">读书笔记</button>
                </div>
                <div class="series-filters" id="seriesFilters"></div>
                <div class="result-count" id="resultCount"></div>
            </div>
            <div class="posts-grid" id="postsGrid">
                <!-- 笔记卡片由 JavaScript 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 标签云 -->
    <section id="tags" class="tags-section">
        <div class="container">
            <h2 class="section-title">标签云</h2>
            <div class="tags-cloud" id="tagsCloud">
                <!-- 标签由 JavaScript 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 关于 -->
    <section id="about" class="about-section">
        <div class="container">
            <h2 class="section-title">关于</h2>
            <div class="about-content">
                <p>这里是我的<span class="highlight">个人学习档案库</span>,沉淀三类笔记:跟课学习的课程笔记、读论文的论文笔记、读书的读书笔记。</p>
                <p>写笔记的原则:不是抄录,而是把知识整理成有逻辑链条、带自己思考的东西——能讲清楚,才算学会。</p>
                <div class="social-links">
                    <a href="https://github.com/Akira-crop" target="_blank" title="GitHub">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 <span class="neon">Akira's Notes</span> // Keep learning, keep noting.</p>
        </div>
    </footer>

    <script src="assets/js/posts-data.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
